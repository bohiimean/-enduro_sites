upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;

    # Бот пропускает документы до 20 МБ, дефолт nginx — 1 МБ: без этой строки
    # фото паспорта отобьётся с 413 (этап 4).
    client_max_body_size 25m;
    # Каталог вынесен на tmpfs в docker-compose — см. комментарий там же.
    client_body_temp_path /var/cache/nginx/client_body;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # Этап 4, загрузка документов KYC.
    # proxy_request_buffering off обязателен: при значении по умолчанию nginx
    # сначала целиком пишет тело запроса во временный файл на диске и только
    # потом отдаёт его Django — то есть паспорт оказался бы на нашем диске в
    # обход договорённости «байты не храним» (см. CLAUDE.md, раздел 152-ФЗ).
    location /api/v1/payments/documents/ {
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend;
    }

    location /api/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend;
    }

    location /admin/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend;
    }
}
