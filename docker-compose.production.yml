name: enduro-site

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enduro}
      POSTGRES_USER: ${POSTGRES_USER:-enduro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enduro} -d ${POSTGRES_DB:-enduro}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  backend:
    <<: *service
    image: enduro-site-backend
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --worker-class gthread --timeout 120"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  worker:
    <<: *service
    image: enduro-site-backend
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
      rates:
        condition: service_healthy
    command: python manage.py run_worker
    mem_limit: 192m

  frontend:
    <<: *service
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    environment:
      NUXT_API_INTERNAL_BASE: http://backend:8000/api/v1
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_PUBLIC_MANAGER_TELEGRAM: ${NUXT_PUBLIC_MANAGER_TELEGRAM:-sklmoto}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m

  rates:
    <<: *service
    build: ./rate-service
    init: true
    env_file: .env
    environment:
      SOURCES_ENABLED: ${SOURCES_ENABLED:-rapira,investing,alfabit_showcase}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 896m
    cpus: 0.75
    shm_size: 128m

  nginx:
    <<: *service
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    tmpfs:
      - /var/cache/nginx/client_body
    mem_limit: 64m

volumes:
  pgdata:
  static:
  media:
